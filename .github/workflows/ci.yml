# SPDX-License-Identifier: Apache-2.0
#
# Runs on every push to main. Every job must pass; a red main is fixed by the
# next commit.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - name: gofmt, go vet, golangci-lint, eslint, tsc, prettier, license headers, generated types
        run: make lint

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress -y
      - name: Install Xvfb, for the X11 remote desktop tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Unit tests
        run: make test
      - name: Integration tests (HTTP, protocol, command line)
        run: make test-integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install npm packages
        run: make web-deps
      - name: Install the Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install Xvfb, for the X11 remote desktop tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Playwright (desktop, phone, and reduced motion)
        run: make test-e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Each fuzz target for 10 seconds
        run: make fuzz FUZZTIME=10s

  coverage:
    name: Coverage and SEC traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Xvfb, for the X11 remote desktop tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Coverage thresholds
        run: make cover
      - name: Every SEC item in scope has a test
        run: make check-sec-coverage

  build:
    name: Build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cross-compile both binaries
        run: make build-all
      - name: No design variant picker in the production build
        run: make check-no-prototype

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: No GPL-family dependencies
        run: make check-licenses
      - name: SPDX header on every source file
        run: make check-headers

# SPDX-License-Identifier: Apache-2.0
#
# Publishes a release when a version tag (v1.2.3) is pushed (§11, M7):
#
#   1. build: every binary, reproducibly, with the web UI built in.
#   2. macos: codesigns the macOS binaries and builds the signed, notarized
#      agent installer (unsigned when the Apple secrets aren't set).
#   3. publish: signs everything with the release key (SEC-30), writes the
#      SBOMs and SHA256SUMS (SEC-33), creates the GitHub release, and pushes
#      the server image to ghcr.io.
#
# Secrets: SENTINEL_RELEASE_KEY (required: the offline release key; the
# build must also trust its public half, see ADR 0027), and, for macOS,
# MACOS_CERTIFICATES_P12 (base64), MACOS_CERTIFICATES_PASSWORD,
# MACOS_APP_IDENTITY, MACOS_INSTALLER_IDENTITY, MACOS_NOTARY_APPLE_ID,
# MACOS_NOTARY_TEAM_ID and MACOS_NOTARY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refuse a build that trusts only the development key
        run: go run ./cmd/sentinel-release check-key
      - name: Build the web UI and every binary
        run: |
          make web
          scripts/release.sh build "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS installer
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/
      - name: Load the Developer ID certificates
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No Apple certificates: the installer will be unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials sentinel --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
          echo "MACOS_NOTARY_PROFILE=sentinel" >> "$GITHUB_ENV"
      - name: Codesign the macOS binaries and build the installer
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: scripts/build-pkg.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*_darwin_*
            dist/*.pkg
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/
      # The codesigned macOS binaries replace the ones built first.
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist/
      - name: Sign, describe and list the release
        env:
          SENTINEL_RELEASE_KEY: ${{ secrets.SENTINEL_RELEASE_KEY }}
        run: scripts/release.sh sign "$GITHUB_REF_NAME"
      - name: Check every signature
        run: |
          for file in dist/sentinel-*_*; do
            case "$file" in *.sig | *.json) continue ;; esac
            go run ./cmd/sentinel-release verify "$file"
          done
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Sentinel $GITHUB_REF_NAME" --generate-notes $prerelease
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the server image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sentinel-server"
          tags=(-t "$image:$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$GITHUB_REF_NAME" "${tags[@]}" --push .

# SPDX-License-Identifier: Apache-2.0
#
# The slower tests that need a real machine (§13.8): they run every night
# and can be started by hand.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zfs:
    name: ZFS with real pools
    # GitHub's Ubuntu runners are VMs whose kernel has the ZFS module, so
    # the test can build pools from sparse files as root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install OpenZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          zfs version
      - name: Compile the test as the runner user, then run it as root
        run: |
          go test -c -tags zfs -o storage.test ./internal/agent/storage
          cd internal/agent/storage
          sudo ../../../storage.test -test.run TestRealZFS -test.v

  reproducible:
    name: Reproducible builds (SEC-33)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build twice from two copies and compare
        run: scripts/check-reproducible.sh

  docker-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build a test release with the development key, then the image
        run: |
          make web
          export SENTINEL_RELEASE_KEY="$(cat testdata/release/development.key)"
          ALLOW_DEVELOPMENT_KEY=1 scripts/release.sh all v0.0.0-nightly linux/amd64
          docker build --build-arg VERSION=v0.0.0-nightly -t sentinel-nightly .
      - name: Start it and check it serves and prints the setup token
        run: |
          docker run -d --name sentinel -p 7443:7443 -v sentinel-data:/var/lib/sentinel sentinel-nightly
          for _ in $(seq 1 30); do curl -fsk https://127.0.0.1:7443/healthz && break; sleep 1; done
          curl -fsk https://127.0.0.1:7443/healthz
          docker logs sentinel 2>&1 | grep "Sentinel setup token:"
